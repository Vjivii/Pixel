<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Take pixel art photos instantly">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="PixelArt">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>PixelArt Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #videoPreview {
            display: none;
        }

        #canvas {
            display: none;
        }

        #pixelatedPreview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .button-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .capture-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .capture-button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.5);
        }

        .capture-button-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
        }

        .record-button-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .record-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 4px solid rgba(255, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .record-button-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff3b30;
            transition: all 0.2s ease;
        }

        .record-button.recording .record-button-indicator {
            border-radius: 10px;
            width: 30px;
            height: 30px;
        }

        .recording-timer {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 11;
        }

        .timer-bar {
            background: #ff3b30;
            padding: 8px 18px;
            border-radius: 999px;
            min-width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-text {
            font-family: "SFMono-Regular", "Roboto Mono", monospace;
            font-size: 18px;
            color: #fff;
            letter-spacing: 2px;
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .permission-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            display: none;
        }

        .permission-hint.show {
            display: block;
        }

        body.orientation-lock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        @media (orientation: landscape) {
            body.orientation-lock {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Initializing camera...</div>
    </div>

    <div class="error-message" id="error">
        <div id="errorText"></div>
        <button style="margin-top: 15px; padding: 10px 20px; background: white; color: black; border: none; border-radius: 5px; cursor: pointer;" onclick="initCamera()">Retry</button>
    </div>

    <div class="permission-hint" id="permissionHint">
        <div>Allow camera access to use the app</div>
    </div>

    <div class="camera-container" id="cameraContainer" style="display: none;">
        <video id="videoPreview" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <canvas id="previewCanvas"></canvas>
        <canvas id="pixelatedPreview"></canvas>
        <div class="record-button-container">
            <div class="record-button" id="recordButton" onclick="toggleRecording()">
                <div class="record-button-indicator"></div>
            </div>
        </div>
        <div class="button-container" id="photoButtonContainer">
            <div class="capture-button" id="captureButton" onclick="capturePhoto()">
                <div class="capture-button-inner"></div>
            </div>
        </div>
        <div class="recording-timer" id="recordingTimer">
            <div class="timer-bar">
                <span class="timer-text" id="timerText">00:00</span>
            </div>
        </div>
    </div>

    <script>
        let stream = null;
        let video = null;
        let canvas = null;
        let ctx = null;
        let previewCanvas = null;
        let previewCtx = null;
        let displayCanvas = null;
        let displayCtx = null;
        let animationFrame = null;
        let isProcessingCapture = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecordingVideo = false;
        let recordingStartTime = null;
        let timerInterval = null;
        const CAMERA_PERMISSION_KEY = 'pixelartCameraPermission';
        const MEDIA_TAG = 'PixelArtCam_v2';

        // Initialize on page load
        window.addEventListener('load', () => {
            document.body.classList.add('orientation-lock');
            lockOrientation();
            initCamera();
            registerServiceWorker();
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.log('Service Worker registration failed', err));
            }
        }

        async function initCamera() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').classList.remove('show');
            document.getElementById('cameraContainer').style.display = 'none';

            try {
                video = document.getElementById('videoPreview');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                displayCanvas = document.getElementById('pixelatedPreview');
                displayCtx = displayCanvas.getContext('2d');
                previewCanvas = document.createElement('canvas');
                previewCtx = previewCanvas.getContext('2d');

                // Request camera access
                const constraints = {
                    video: {
                        facingMode: 'environment', // Use back camera
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                const permissionState = await getCameraPermissionState();
                if (permissionState === 'denied') {
                    throw new Error('Camera access denied. Please enable it in your system settings.');
                }

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.srcObject = stream;
                await video.play();

                // Set canvas size to match video
                canvas.width = 1920;
                canvas.height = 1080;

                localStorage.setItem(CAMERA_PERMISSION_KEY, 'granted');
                const permissionHint = document.getElementById('permissionHint');
                if (permissionHint) {
                    permissionHint.classList.remove('show');
                }
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cameraContainer').style.display = 'block';

                // Start real-time pixelation preview
                startPreview();

            } catch (error) {
                console.error('Camera error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').classList.add('show');
                document.getElementById('errorText').textContent = error.message || 'Unable to access camera. Please allow camera access.';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    const permissionHint = document.getElementById('permissionHint');
                    if (permissionHint) {
                        permissionHint.classList.add('show');
                    }
                }
            }
        }

        function startPreview() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            const pixelSize = 8; // Adjust for more/less pixelation
            
            function drawFrame() {
                if (!video || video.videoWidth === 0) {
                    animationFrame = requestAnimationFrame(drawFrame);
                    return;
                }

                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;
                const displayWidth = window.innerWidth;
                const displayHeight = window.innerHeight;

                // Set preview canvas to video size
                if (previewCanvas.width !== videoWidth || previewCanvas.height !== videoHeight) {
                    previewCanvas.width = videoWidth;
                    previewCanvas.height = videoHeight;
                }

                // Set display canvas to screen size
                if (displayCanvas.width !== displayWidth || displayCanvas.height !== displayHeight) {
                    displayCanvas.width = displayWidth;
                    displayCanvas.height = displayHeight;
                }

                // Draw original video to preview canvas
                previewCtx.drawImage(video, 0, 0);

                // Get image data
                const imageData = previewCtx.getImageData(0, 0, videoWidth, videoHeight);
                const data = imageData.data;

                // Apply pixelation effect to preview canvas
                for (let y = 0; y < videoHeight; y += pixelSize) {
                    for (let x = 0; x < videoWidth; x += pixelSize) {
                        // Sample the color from the center of the pixel block
                        const idx = (Math.floor(y + pixelSize/2) * videoWidth + Math.floor(x + pixelSize/2)) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        const a = data[idx + 3];

                        // Fill the entire pixel block with that color
                        previewCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;
                        previewCtx.fillRect(x, y, pixelSize, pixelSize);
                    }
                }

                // Draw pixelated preview to display canvas
                displayCtx.clearRect(0, 0, displayWidth, displayHeight);
                displayCtx.drawImage(previewCanvas, 0, 0, displayWidth, displayHeight);

                animationFrame = requestAnimationFrame(drawFrame);
            }

            drawFrame();
        }

        async function capturePhoto() {
            if (!video || !stream) return;
            if (isProcessingCapture || isRecordingVideo) return;

            try {
                isProcessingCapture = true;
                // Stop the preview
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;

                canvas.width = videoWidth;
                canvas.height = videoHeight;

                // Draw the current video frame to canvas
                ctx.drawImage(video, 0, 0);

                // Apply pixelation effect to canvas
                applyPixelation(canvas, ctx, videoWidth, videoHeight, 8);

                // Convert canvas to blob
                canvas.toBlob(async (blob) => {
                    try {
                        if (blob) {
                            await savePhoto(blob);
                        }
                    } catch (e) {
                        console.error('Error in save flow:', e);
                    } finally {
                        startPreview();
                        isProcessingCapture = false;
                    }
                }, 'image/jpeg', 0.95);

            } catch (error) {
                console.error('Error capturing photo:', error);
                try { startPreview(); } catch (_) {}
                isProcessingCapture = false;
            }
        }

        function applyPixelation(canvas, ctx, width, height, pixelSize) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Apply pixelation
            for (let y = 0; y < height; y += pixelSize) {
                for (let x = 0; x < width; x += pixelSize) {
                    const idx = (Math.floor(y + pixelSize/2) * width + Math.floor(x + pixelSize/2)) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;
                    ctx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }

        async function savePhoto(blob) {
            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const filename = `${MEDIA_TAG}-photo-${timestamp}.jpg`;
                const file = new File([blob], filename, { type: 'image/jpeg' });

                // Try Web Share API first (iOS Safari supports this better)
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'PixelArtCam v2 Photo',
                            text: `Captured with ${MEDIA_TAG}`
                        });
                        
                        showCaptureFeedback();
                        return;
                    } catch (shareError) {
                        // If user cancels (AbortError) or disallows, just return gracefully
                        if (shareError && (shareError.name === 'AbortError' || shareError.name === 'NotAllowedError')) {
                            console.log('Share dismissed by user.');
                            return;
                        }
                        // Otherwise, fall through to download
                        console.log('Share failed, using download:', shareError);
                    }
                }

                // Fallback to download method
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                setTimeout(() => URL.revokeObjectURL(url), 100);
                showCaptureFeedback();

            } catch (error) {
                console.error('Error saving photo:', error);
                // Swallow to keep UI responsive
            }
        }

        function toggleRecording() {
            if (!displayCanvas || isProcessingCapture) return;
            if (isRecordingVideo) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=h264',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
        }

        function startRecording() {
            if (isRecordingVideo) return;
            const captureStream = displayCanvas.captureStream ? displayCanvas.captureStream(30) : null;
            if (!captureStream) {
                console.warn('Canvas captureStream is not supported in this browser.');
                return;
            }

            const mimeType = getSupportedMimeType();
            try {
                mediaRecorder = mimeType ? new MediaRecorder(captureStream, { mimeType }) : new MediaRecorder(captureStream);
            } catch (error) {
                console.error('Unable to start recording:', error);
                return;
            }

            recordedChunks = [];
            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            mediaRecorder.onstop = async () => {
                const recorderMime = mediaRecorder ? mediaRecorder.mimeType : '';
                const type = recorderMime || mimeType || 'video/webm';
                const blob = new Blob(recordedChunks, { type });
                mediaRecorder = null;
                resetRecordingUI();
                if (blob.size > 0) {
                    await saveVideo(blob);
                }
            };

            mediaRecorder.start();
            isRecordingVideo = true;
            recordingStartTime = Date.now();
            updateRecordingUI(true);
            timerInterval = setInterval(updateRecordingTimer, 500);
        }

        function stopRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
            mediaRecorder.stop();
        }

        function resetRecordingUI() {
            isRecordingVideo = false;
            updateRecordingUI(false);
            recordingStartTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const timerText = document.getElementById('timerText');
            if (timerText) {
                timerText.textContent = '00:00';
            }
        }

        function updateRecordingUI(recording) {
            const recordButton = document.getElementById('recordButton');
            const photoContainer = document.getElementById('photoButtonContainer');
            const timer = document.getElementById('recordingTimer');
            if (recordButton) {
                recordButton.classList.toggle('recording', recording);
            }
            if (photoContainer) {
                photoContainer.style.display = recording ? 'none' : 'flex';
            }
            if (timer) {
                timer.style.display = recording ? 'flex' : 'none';
            }
        }

        function updateRecordingTimer() {
            if (!recordingStartTime) return;
            const elapsed = Date.now() - recordingStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            const timerText = document.getElementById('timerText');
            if (timerText) {
                timerText.textContent = `${mins}:${secs}`;
            }
        }

        async function saveVideo(blob) {
            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const mime = blob.type || 'video/webm';
                const extension = mime.includes('mp4') ? 'mp4' : 'webm';
                const filename = `${MEDIA_TAG}-video-${timestamp}.${extension}`;
                const file = new File([blob], filename, { type: mime });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'PixelArtCam v2 Video',
                            text: `Captured with ${MEDIA_TAG}`
                        });
                        return;
                    } catch (shareError) {
                        if (shareError && (shareError.name === 'AbortError' || shareError.name === 'NotAllowedError')) {
                            console.log('Video share dismissed by user.');
                            return;
                        }
                        console.log('Video share failed, falling back to download.', shareError);
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 100);

            } catch (error) {
                console.error('Error saving video:', error);
            }
        }

        function showCaptureFeedback() {
            const button = document.getElementById('captureButton');
            const originalBg = button.style.background;
            button.style.background = 'rgba(0, 255, 0, 0.5)';
            setTimeout(() => {
                button.style.background = originalBg;
            }, 300);
        }

        // Handle visibility change to resume camera
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRecordingVideo) {
                stopRecording();
            }

            if (!document.hidden && stream) {
                try { video.play(); } catch (_) {}
                // Avoid duplicating loops; cancel any stale frame first
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                if (!isProcessingCapture) {
                    startPreview();
                }
            }
        });

        async function lockOrientation() {
            const orientation = screen.orientation || screen.msOrientation || screen.mozOrientation;
            if (orientation && orientation.lock) {
                try {
                    await orientation.lock('portrait');
                } catch (error) {
                    console.log('Orientation lock not supported:', error);
                }
            }
        }

        async function getCameraPermissionState() {
            if (!navigator.permissions || !navigator.permissions.query) {
                return localStorage.getItem(CAMERA_PERMISSION_KEY) || 'prompt';
            }
            try {
                const status = await navigator.permissions.query({ name: 'camera' });
                return status.state;
            } catch (error) {
                return localStorage.getItem(CAMERA_PERMISSION_KEY) || 'prompt';
            }
        }
    </script>
</body>
</html>
